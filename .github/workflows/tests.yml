name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Cœur en Python pur (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: lyrx2qlr --verifier-catalogues
      - run: pytest -q
      - name: Préparer l'application web et l'extension
        run: python outils/construire.py tout
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: lyrx2qlr-construit
          path: |
            web/
            dist/*.zip

  qgis:
    name: Vérification dans QGIS
    runs-on: ubuntu-latest
    container: qgis/qgis:3.40  # l'ancienne étiquette « release-3_40 » n'existe plus sur Docker Hub
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --break-system-packages pytest || python3 -m pip install pytest
      - name: Tests dans QGIS (chargement, réexport, extension)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        # Le journal n'est lisible qu'une fois connecté à GitHub : en cas d'échec, les dernières
        # lignes (dernier test lancé, trace d'un plantage) sont aussi publiées en annotations.
        run: |
          set +e
          python3 -X faulthandler -m pytest -v -p no:cacheprovider tests/test_qgis.py tests/test_extension.py > sortie.txt 2>&1
          code=$?
          cat sortie.txt
          if [ "$code" != "0" ]; then
            grep -E "::" sortie.txt | grep -v "PASSED\|SKIPPED" | tail -n 3 | while IFS= read -r l; do echo "::warning::test : $l"; done
            grep -A 12 "Current thread" sortie.txt | head -n 13 | while IFS= read -r l; do echo "::warning::trace : $l"; done
            grep -E "FAILED|Error" sortie.txt | tail -n 5 | while IFS= read -r l; do echo "::warning::$l"; done
            tail -n 2 sortie.txt | while IFS= read -r l; do echo "::warning::fin : $l"; done
          fi
          exit $code
